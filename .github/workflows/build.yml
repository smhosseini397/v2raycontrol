
name: Build Happ Guard APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Verify Android SDK
        run: |
          echo "Checking Android SDK..."
          ls -la "$ANDROID_HOME/platforms"
          ls -la "$ANDROID_HOME/build-tools"

      - name: Install Gradle 8.11.1
        run: |
          curl -fL https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -o gradle.zip
          unzip -q gradle.zip -d "$HOME"
          echo "$HOME/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      - name: Verify Gradle
        run: gradle --version

      - name: Show Manifest File
        run: |
          echo "========== ANDROID MANIFEST =========="
          cat -n happ_guard/app/src/main/AndroidManifest.xml
          echo "======================================"

      - name: Validate Android XML Files
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          import os
          import sys

          root = "happ_guard/app/src/main"
          failed = False

          for folder, dirs, files in os.walk(root):
              for filename in files:
                  if filename.endswith(".xml"):
                      path = os.path.join(folder, filename)
                      try:
                          ET.parse(path)
                          print("XML OK:", path)
                      except ET.ParseError as e:
                          print("XML ERROR:", path)
                          print("DETAIL:", e)
                          failed = True

          if failed:
              sys.exit(1)

          print("All XML files passed validation.")
          PY

      - name: Build Happ Guard APK
        shell: bash
        run: |
          set +e

          gradle -p happ_guard --no-daemon :app:compileDebugKotlin --stacktrace --info 2>&1 | tee kotlin-error.log

          RESULT=${PIPESTATUS[0]}

          echo ""
          echo "========== KOTLIN COMPILATION ERRORS =========="
          grep -n -E "^e: |^w: " kotlin-error.log || true
          echo "==============================================="

          echo ""
          echo "========== ERROR CONTEXT =========="
          grep -n -B 5 -A 10 "^e: " kotlin-error.log || true
          echo "==================================="

          exit "$RESULT"

      - name: Upload Kotlin Error Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HappGuard-Kotlin-Error-Log
          path: kotlin-error.log
          if-no-files-found: ignore

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HappGuard-APK
          path: happ_guard/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
