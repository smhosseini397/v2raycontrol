
name: Build Happ Guard APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Check existing Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME"
          echo "Installed Android platforms:"
          ls -la "$ANDROID_HOME/platforms" || true
          echo "Installed build tools:"
          ls -la "$ANDROID_HOME/build-tools" || true

      - name: Install Gradle 8.11.1
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -o gradle.zip
          unzip -q gradle.zip -d "$HOME"
          echo "$HOME/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      - name: Verify Gradle
        run: gradle --version

      - name: Build Happ Guard APK
        run: |
          gradle -p happ_guard --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HappGuard-APK
          path: happ_guard/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
